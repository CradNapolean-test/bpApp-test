<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Offline · Ballistic Performance</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;box-sizing:border-box}
  img{width:88px;height:88px;border-radius:20px}
  h1{margin:6px 0 0;font-size:22px;font-weight:800}
  p{margin:0;max-width:300px;color:#9a9a9a;font-size:15px;line-height:1.5}
  .plan{width:100%;max-width:340px;text-align:left;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:18px;padding:16px;margin-top:6px}
  .plan h2{margin:0 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#19adb1}
  .plan .big{font-size:26px;font-weight:800;margin:2px 0}
  .plan .sub{color:#9a9a9a;font-size:13px;margin:0}
  .plan ul{list-style:none;margin:8px 0 0;padding:0}
  .plan li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #2e2e2e;font-size:14px}
  .plan li span:last-child{color:#9a9a9a;white-space:nowrap}
  .stamp{font-size:12px;color:#6b6b6b}
  button{margin-top:10px;border:0;border-radius:999px;background:#19adb1;color:#fff;font-weight:800;font-size:15px;padding:13px 28px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You&rsquo;re offline</h1>
  <p>Ballistic needs a connection to load your sessions, food and messages. Check your signal or Wi&#8209;Fi and try again.</p>
  <div id="plan"></div>
  <button onclick="location.reload()">Try again</button>
</main>
<script>
window.addEventListener('online',function(){location.reload()});
(function(){
  try{
    var raw=localStorage.getItem('bp-offline-snapshot'); if(!raw) return;
    var s=JSON.parse(raw); var el=document.getElementById('plan');
    var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
    var html='';
    if(s.targets){
      html+='<div class="plan"><h2>Your daily targets</h2><div class="big">'+esc(s.targets.calories)+' kcal</div>'+
        '<p class="sub">'+esc(s.targets.protein)+'g protein &middot; '+esc(s.targets.carbs)+'g carbs &middot; '+esc(s.targets.fat)+'g fat</p></div>';
    }
    if(s.workout){
      html+='<div class="plan"><h2>Today&rsquo;s workout</h2><div class="sub">'+esc(s.workout.label)+'</div><ul>';
      s.workout.exercises.forEach(function(e){
        var det=[e.sets&&e.reps?e.sets+' x '+e.reps:(e.sets||e.reps||''), e.load?e.load+'kg':''].filter(Boolean).join(' @ ');
        html+='<li><span>'+esc(e.name)+'</span><span>'+esc(det)+'</span></li>';
      });
      html+='</ul></div>';
    }
    if(html){
      var d=new Date(s.savedAt);
      html+='<p class="stamp">Saved from your last visit, '+d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'})+'</p>';
      el.innerHTML=html;
    }
  }catch(e){}
})();
</script>
</body>
</html>
